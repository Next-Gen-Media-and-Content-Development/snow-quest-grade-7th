<script>
// ── Question bank ─────────────────────────────────────────────────────────
const QS = [

  // ── 1. Single correct ─────────────────────────────────────────────────
  {
    type:'mcq', topic:'indicators', difficulty:'easy',
    question:'Red litmus paper is dipped into lemon juice. What colour change, if any, is observed?',
    options:['It turns blue','It turns green','It remains red','It turns yellow'],
    answer:2,
    explanation:'Lemon juice is acidic. Red litmus stays red in acids — only blue litmus turns red in acid. No change is observed in red litmus.'
  },

  // ── 2. Single correct ─────────────────────────────────────────────────
  {
    type:'mcq', topic:'indicators', difficulty:'easy',
    question:'Turmeric paste is rubbed onto a white shirt. When soap solution is applied, the stain turns bright red. This is because soap is:',
    options:['Acidic in nature','Basic in nature','Neutral in nature','A synthetic indicator'],

    explanation:'Turmeric is a natural indicator that turns red/pink in basic (alkaline) solutions. Soap is basic, so the turmeric stain turns bright red on contact with soap.'
  },

  // ── 3. Image-based ────────────────────────────────────────────────────
  {
    type:'image', topic:'acids-bases', difficulty:'medium',

  <defs>

      <stop offset="0%"   stop-color="#e53935"/>

      <stop offset="50%"  stop-color="#a5d6a7"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect x="30" y="40" width="460" height="28" rx="6" fill="url(#phg)"/>
  <!-- tick marks 0-14 -->
  <line x1="30"  y1="68" x2="30"  y2="76" stroke="#555" stroke-width="1.5"/>
  <line x1="63"  y1="68" x2="63"  y2="74" stroke="#555" stroke-width="1"/>
  <line x1="96"  y1="68" x2="96"  y2="74" stroke="#555" stroke-width="1"/>
  <line x1="129" y1="68" x2="129" y2="74" stroke="#555" stroke-width="1"/>
  <line x1="162" y1="68" x2="162" y2="74" stroke="#555" stroke-width="1"/>

  <line x1="228" y1="68" x2="228" y2="74" stroke="#555" stroke-width="1"/>
  <line x1="261" y1="68" x2="261" y2="76" stroke="#555" stroke-width="1.5"/>
  <line x1="294" y1="68" x2="294" y2="74" stroke="#555" stroke-width="1"/>
  <line x1="327" y1="68" x2="327" y2="74" stroke="#555" stroke-width="1"/>
  <line x1="360" y1="68" x2="360" y2="74" stroke="#555" stroke-width="1"/>
  <line x1="393" y1="68" x2="393" y2="76" stroke="#555" stroke-width="1.5"/>
  <line x1="426" y1="68" x2="426" y2="74" stroke="#555" stroke-width="1"/>
  <line x1="459" y1="68" x2="459" y2="74" stroke="#555" stroke-width="1"/>
  <line x1="490" y1="68" x2="490" y2="76" stroke="#555" stroke-width="1.5"/>
  <!-- labels -->
  <text x="27"  y="90" font-size="11" text-anchor="middle" fill="#555">0</text>
  <text x="195" y="90" font-size="11" text-anchor="middle" fill="#555">6</text>
  <text x="261" y="90" font-size="11" text-anchor="middle" fill="#555">7</text>
  <text x="393" y="90" font-size="11" text-anchor="middle" fill="#555">11</text>
  <text x="490" y="90" font-size="11" text-anchor="middle" fill="#555">14</text>

  <text x="261" y="110" font-size="10" text-anchor="middle" fill="#388e3c">Neutral</text>
  <text x="400" y="110" font-size="10" text-anchor="middle" fill="#1565c0">Basic →</text>
  <!-- substance markers -->
  <circle cx="80"  cy="54" r="7" fill="#fff" stroke="#e53935" stroke-width="2"/>
  <text x="80"  cy="54" y="57" font-size="9" text-anchor="middle" fill="#e53935" font-weight="800">P</text>
  <circle cx="180" cy="54" r="7" fill="#fff" stroke="#f57f17" stroke-width="2"/>

  <circle cx="261" cy="54" r="7" fill="#fff" stroke="#388e3c" stroke-width="2"/>

  {

    explanation:'Red litmus turns blue only in a BASIC solution, not in an acidic one. In an acidic solution, red litmus remains red (no change). All other statements are correct.'

    type:'mcq', topic:'acids-bases', difficulty:'easy',

// ── State ─────────────────────────────────────────────────────────────────
const SLUG = 'exploring_substance_acidic_';
let answers   = {};
let locked    = {};
let filterMode = 'all';
let prevWrong = [];
try { prevWrong = JSON.parse(localStorage.getItem('ngmc_wrong_' + SLUG) || '[]'); } catch(e) {}

// ── Type meta ─────────────────────────────────────────────────────────────
const TYPE_META = {
  mcq:       { label:'Single Correct', cls:'leg-scq', emoji:'✅' },
  incorrect: { label:'Incorrect Statement', cls:'leg-inc', emoji:'⚠️' },
  correct:   { label:'Correct Statement', cls:'leg-cor', emoji:'🔵' },
  matrix:    { label:'Matrix Match', cls:'leg-mat', emoji:'🟣' },
  image:     { label:'Image Based', cls:'leg-img', emoji:'🖼️' },
  case:      { label:'Case Based', cls:'leg-cas', emoji:'📖' }
};

// ── Render ────────────────────────────────────────────────────────────────
function renderQuestions(qlist) {
  const cont = document.getElementById('q-container');
  cont.innerHTML = '';
  qlist.forEach((q, localIdx) => {
    const realIdx = QS.indexOf(q);
    const tm = TYPE_META[q.type] || TYPE_META['mcq'];
    const diff = q.difficulty || 'medium';

    // passage block
    const passageHtml = q.passage
      ? `<div class="passage">${q.passage}</div>`
      : '';

    // matrix columns
    let matrixHtml = '';
    if (q.type === 'matrix') {
      const colARows = (q.colA || []).map(r => `<div class="matrix-row">${r}</div>`).join('');
      const colBRows = (q.colB || []).map(r => `<div class="matrix-row">${r}</div>`).join('');
      matrixHtml = `<div class="matrix-wrap">
        <div class="matrix-col"><h4>Column A</h4>${colARows}</div>
        <div class="matrix-col"><h4>Column B</h4>${colBRows}</div>
      </div>`;
    }

    // svg diagram
    const diagramHtml = q.svg
      ? `<div class="diagram-wrap">${q.svg}</div>`
      : '';

    // options
    const optsHtml = q.options.map((o, oi) => {
      const label = String.fromCharCode(65 + oi);
      return `<button class="opt-btn" id="opt-${realIdx}-${oi}" onclick="pick(${realIdx},${oi})"><span class="opt-label">${label}</span>${o}</button>`;
    }).join('');

    cont.innerHTML += `
    <div class="q-card" id="q-${realIdx}" data-type="${q.type}" data-topic="${q.topic}">
      <div class="card-top">
        <div class="q-num">Q${realIdx+1}</div>
        <div class="card-meta">
          <span class="type-chip ${tm.cls}">${tm.emoji} ${tm.label}</span>
          <span class="diff-badge ${diff}">${diff.charAt(0).toUpperCase()+diff.slice(1)}</span>
        </div>
      </div>
      ${passageHtml}
      <div class="q-text">${q.question}</div>
      ${matrixHtml}
      ${diagramHtml}
      <div class="options">${optsHtml}</div>
      <div class="explanation" id="exp-${realIdx}">${q.explanation}</div>
    </div>`;
  });
}

// ── Filter ────────────────────────────────────────────────────────────────
function filterTopic(t, el) {
  filterMode = t;
  document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
  document.getElementById('score-panel').style.display = 'none';
  document.getElementById('submit-btn').style.display = 'block';
  answers = {}; locked = {};
  const filtered = t === 'all'     ? QS
                 : t === 'revision'? QS.filter((_,i) => prevWrong.includes(i))
                 : QS.filter(q => q.topic === t);
  renderQuestions(filtered.length ? filtered : QS);
}

// ── Pick ──────────────────────────────────────────────────────────────────
function pick(idx, oi) {
  if (locked[idx]) return;
  answers[idx] = oi;
  document.querySelectorAll(`[id^="opt-${idx}-"]`).forEach(b => {
    b.classList.remove('selected');
    b.style.background = '';
  });
  const btn = document.getElementById(`opt-${idx}-${oi}`);
  if (btn) btn.classList.add('selected');
}

// ── Submit ────────────────────────────────────────────────────────────────
function submitAll() {
  let correct = 0, total = 0;
  const wrongNow = [];
  const topicStats = {};

  QS.forEach((q, idx) => {
    const card = document.getElementById('q-' + idx);
    if (!card || card.classList.contains('hidden')) return;
    total++;
    const chosen   = answers[idx];
    const isCorrect = chosen === q.answer;
    if (isCorrect) correct++;
    else wrongNow.push(idx);
    locked[idx] = true;

    q.options.forEach((_, oi) => {
      const btn = document.getElementById(`opt-${idx}-${oi}`);
      if (!btn) return;
      btn.classList.add('locked');
      btn.classList.remove('selected');
      btn.style.background = '';
      if (oi === q.answer) btn.classList.add('correct');
      else if (oi === chosen) btn.classList.add('wrong');
    });
    const exp = document.getElementById('exp-' + idx);
    if (exp) exp.style.display = 'block';

    const t = q.topic || 'General';
    if (!topicStats[t]) topicStats[t] = {correct:0, total:0};
    topicStats[t].total++;
    if (isCorrect) topicStats[t].correct++;
  });

  try { localStorage.setItem('ngmc_wrong_' + SLUG, JSON.stringify(wrongNow)); } catch(e) {}
  try { localStorage.setItem('ngmc_prog_mcq.html', Math.round(correct/Math.max(total,1)*100)); } catch(e) {}

  const pct = total ? Math.round(correct/total*100) : 0;
  const mood = pct >= 80 ? '🎉' : pct >= 50 ? '😊' : '😅';

  let topicRows = '';
  Object.entries(topicStats).forEach(([name, st]) => {
    const p  = Math.round(st.correct/st.total*100);
    const filled = Math.round(p/20);
    const stars  = '⭐'.repeat(filled) + '☆'.repeat(5-filled);
    const revise = p < 60 ? `<a class="revise-link" href="notes.html">Revise →</a>` : '';
    const label = {indicators:'🌿 Indicators','acids-bases':'🧪 Acids & Bases',neutralisation:'⚗️ Neutralisation'}[name] || name;
    topicRows += `<div class="topic-row"><span class="topic-name">${label}</span><span class="topic-stars">${stars}</span><span class="topic-pct">${p}%</span>${revise}</div>`;
  });

  const wrongBtn = wrongNow.length
    ? `<button class="mode-btn btn-revise" onclick="filterTopic('revision',document.getElementById('btn-revision'))">📌 Revise Wrong (${wrongNow.length})</button>` : '';

  const panel = document.getElementById('score-panel');
  panel.innerHTML = `
    <h2>${mood} You scored ${correct} / ${total}</h2>
    <div class="stats-row">
      <div class="stat-box"><div class="num" style="color:#4caf50">${correct}</div><div class="lbl">Correct ✅</div></div>
      <div class="stat-box"><div class="num" style="color:#e91e63">${total-correct}</div><div class="lbl">Wrong ❌</div></div>
      <div class="stat-box"><div class="num">${pct}%</div><div class="lbl">Score 📊</div></div>
    </div>
    <h3 style="margin:.5rem 0;font-family:var(--fh)">📚 Topic Analysis</h3>
    ${topicRows}
    <div class="mode-btns">
      <button class="mode-btn btn-retry" onclick="location.reload()">🔄 Retry All</button>
      ${wrongBtn}
    </div>`;
  panel.style.display = 'block';
  document.getElementById('submit-btn').style.display = 'none';
  panel.scrollIntoView({behavior:'smooth'});
}

// ── Init ──────────────────────────────────────────────────────────────────
if (location.hash === '#revision' && prevWrong.length > 0) {
  filterMode = 'revision';
  document.getElementById('btn-revision').classList.add('active');
  document.querySelector('.topic-btn.active')?.classList.remove('active');
}
renderQuestions(filterMode === 'revision' ? QS.filter((_,i) => prevWrong.includes(i)) : QS);
</script>
