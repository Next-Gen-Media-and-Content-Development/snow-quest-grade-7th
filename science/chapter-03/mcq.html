const QS = [{"type": "mcq", "topic": "3.Electricity c", "difficulty": "easy", "question": "On an electric cell, the small protruding metal cap is which terminal?", "options": ["Positive terminal", "Negative terminal", "Neutral terminal", "It is not a terminal"], "answer": 0, "explanation": "The metal cap of an electric cell is its positive (+ve) terminal, while the flat metal disc on the other side is the negative (–ve) terminal."}, {"type": "mcq", "topic": "3.Electricity c", "difficulty": "easy", "question": "What do we call a combination of two or more electric cells connected together?", "options": ["A circuit diagram", "A battery", "A switch", "An insulator"], "answer": 1, "explanation": "When two or more cells are connected together, with the positive terminal of one cell joined to the negative terminal of the next, the combination is called a battery."}, {"type": "correct", "topic": "3.Electricity c", "difficulty": "medium", "question": "Which of the following statements about an incandescent lamp is CORRECT?", "options": ["Its filament glows because it gets hot when current passes through it", "Its filament is made of glass", "It has no filament at all", "Its glass bulb conducts electricity"], "answer": 0, "explanation": "In an incandescent lamp, current passing through the thin filament heats it up until it glows and produces light. The glass bulb and its base are insulators, not conductors."}, {"type": "incorrect", "topic": "3.Electricity c", "difficulty": "medium", "question": "Which of the following statements about an LED is INCORRECT?", "options": ["An LED has a positive and a negative terminal", "The longer wire of an LED is its positive terminal", "An LED glows no matter which way its terminals are connected", "Current can pass through an LED in only one direction"], "answer": 2, "explanation": "Unlike an incandescent lamp, an LED glows only when its positive terminal (longer wire) is connected to the battery's positive terminal and its negative terminal (shorter wire) to the negative. If the connections are reversed, the LED will not glow."}, {"type": "mcq", "topic": "3.Electricity c", "difficulty": "easy", "question": "A lamp connected in an electrical circuit glows only when:", "options": ["The circuit is left open", "The circuit is complete and closed", "The wires are disconnected", "The switch is removed"], "answer": 1, "explanation": "A lamp glows only when the circuit provides a complete path and current can flow all the way through it, back to the cell."}, {"type": "mcq", "topic": "3.Electricity c", "difficulty": "easy", "question": "What is the main function of a switch in an electrical circuit?", "options": ["It generates electric current", "It stores electrical energy permanently", "It completes or breaks the circuit", "It converts AC current to DC current"], "answer": 2, "explanation": "A switch is a simple device that either completes a circuit (ON position) or breaks it (OFF position), allowing us to control when current flows."}, {"type": "image", "topic": "3.Electricity c", "difficulty": "medium", "question": "Look at the circuit symbol shown below. What electrical component does it represent?", "svg": "<svg viewBox='0 0 160 90' width='160' height='90' xmlns='http://www.w3.org/2000/svg'><line x1='10' y1='45' x2='55' y2='45' stroke='#333' stroke-width='2'/><circle cx='80' cy='45' r='25' fill='none' stroke='#333' stroke-width='2'/><line x1='62' y1='27' x2='98' y2='63' stroke='#333' stroke-width='2'/><line x1='98' y1='27' x2='62' y2='63' stroke='#333' stroke-width='2'/><line x1='105' y1='45' x2='150' y2='45' stroke='#333' stroke-width='2'/></svg>", "options": ["Electric cell", "Battery", "Electric lamp", "Switch"], "answer": 2, "explanation": "A circle with a cross inside it is the standard circuit-diagram symbol for an electric lamp (Table 3.2)."}, {"type": "mcq", "topic": "3.Electricity c", "difficulty": "medium", "question": "In the circuit symbol for an electric cell, what does the long line represent?", "options": ["The negative terminal", "The positive terminal", "The filament", "The switch"], "answer": 1, "explanation": "In the symbol for an electric cell, the long line represents the positive terminal, while the short line represents the negative terminal."}, {"type": "matrix", "topic": "3.Electricity c", "difficulty": "hard", "question": "Which of the following material-classification pairs is INCORRECTLY matched?", "colA": ["Copper wire", "Rubber", "Plastic scale", "Iron key"], "colB": ["Conductor", "Insulator", "Conductor", "Conductor"], "options": ["Copper wire – Conductor", "Rubber – Insulator", "Plastic scale – Conductor", "Iron key – Conductor"], "answer": 2, "explanation": "Plastic is an electrical insulator, not a conductor — so ‘Plastic scale – Conductor’ is the incorrect match. Copper and iron are good conductors; rubber is an insulator."}, {"type": "case", "topic": "3.Electricity c", "difficulty": "hard", "passage": "Vidyut set up a simple circuit using a cell, an LED, and connecting wires. When she closed the circuit, the LED did not glow. She checked her cell in another circuit with an incandescent lamp, and the lamp glowed normally, so the cell was working fine.", "question": "What is the most likely reason Vidyut's LED did not glow?", "options": ["The LED's terminals are connected in reverse", "The cell has too much charge", "The connecting wires are too long", "The switch is glowing instead of the LED"], "answer": 0, "explanation": "An LED only allows current to pass in one direction. Since the cell works fine with an incandescent lamp (which glows regardless of terminal direction), the most likely fault is that the LED's positive and negative wires are connected the wrong way round."}, {"type": "mcq", "topic": "3.Electricity c", "difficulty": "medium", "question": "Silver, copper, and gold are the best electrical conductors. Which one is mainly used for making electrical wires, and why?", "options": ["Silver, because it is the shiniest", "Copper, due to its lower cost and abundant supply", "Gold, because it never corrodes", "None of them — wires are made of plastic"], "answer": 1, "explanation": "Although silver, copper, and gold are all excellent conductors, copper is mainly used for electrical wires because it is much cheaper and more abundantly available."}, {"type": "mcq", "topic": "3.Electricity c", "difficulty": "medium", "question": "The electricity supplied to a wall socket from a power plant is known as:", "options": ["Direct Current (DC)", "Alternating Current (AC)", "Static current", "Chemical current"], "answer": 1, "explanation": "Electricity from cells and batteries is Direct Current (DC) and powers small devices. Electricity from power plants that reaches wall sockets is Alternating Current (AC), which can run larger appliances."}];
const QTYPE_META = {"mcq": {"label": "Single Correct", "chip": "leg-scq", "emoji": "&#9989;"}, "incorrect": {"label": "Incorrect Statement", "chip": "leg-inc", "emoji": "&#9888;&#65039;"}, "correct": {"label": "Correct Statement", "chip": "leg-cor", "emoji": "&#128309;"}, "matrix": {"label": "Matrix Match", "chip": "leg-mat", "emoji": "&#128995;"}, "image": {"label": "Image Based", "chip": "leg-img", "emoji": "&#128444;&#65039;"}, "case": {"label": "Case Based", "chip": "leg-cas", "emoji": "&#128214;"}};
const SLUG = '3.electricity_circui';
let answers = {};
let locked = {};
let filterMode = 'all';
let prevWrong = [];
try { prevWrong = JSON.parse(localStorage.getItem('ngmc_wrong_' + SLUG) || '[]'); } catch(e) {}

function renderQuestions(qlist) {
  const cont = document.getElementById('q-container');
  cont.innerHTML = '';
  qlist.forEach(q => {
    const realIdx = QS.indexOf(q);
    const tm = QTYPE_META[q.type] || QTYPE_META['mcq'];
    const diff = q.difficulty || 'medium';

    const passageHtml = q.passage ? `<div class="passage">${q.passage}</div>` : '';

    let matrixHtml = '';
    if (q.type === 'matrix') {
      const colARows = (q.colA || []).map(r => `<div class="matrix-row">${r}</div>`).join('');
      const colBRows = (q.colB || []).map(r => `<div class="matrix-row">${r}</div>`).join('');
      matrixHtml = `<div class="matrix-wrap"><div class="matrix-col"><h4>Column A</h4>${colARows}</div><div class="matrix-col"><h4>Column B</h4>${colBRows}</div></div>`;
    }

    const diagramHtml = q.svg ? `<div class="diagram-wrap">${q.svg}</div>` : '';

    const optsHtml = q.options.map((o, oi) => {
      const label = String.fromCharCode(65 + oi);
      return `<button class="opt-btn" id="opt-${realIdx}-${oi}" onclick="pick(${realIdx},${oi})"><span class="opt-label">${label}</span>${o}</button>`;
    }).join('');

    cont.innerHTML += `
    <div class="q-card" id="q-${realIdx}" data-type="${q.type}" data-topic="${q.topic}">
      <div class="card-top">
        <div class="q-num">Q${realIdx+1}</div>
        <div class="card-meta">
          <span class="type-chip ${tm.chip}">${tm.emoji} ${tm.label}</span>
          <span class="diff-badge ${diff}">${diff.charAt(0).toUpperCase()+diff.slice(1)}</span>
        </div>
      </div>
      ${passageHtml}
      <div class="q-text">${q.question}</div>
      ${matrixHtml}
      ${diagramHtml}
      <div class="options">${optsHtml}</div>
      <div class="explanation" id="exp-${realIdx}">${q.explanation}</div>
    </div>`;
  });
}

function getFilteredQs() {
  if (filterMode === 'all') return QS;
  if (filterMode === 'revision') return QS.filter((q,i) => prevWrong.includes(i));
  return QS.filter(q => q.topic === filterMode);
}

function filterTopic(t, el) {
  filterMode = t;
  document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
  document.getElementById('score-panel').style.display = 'none';
  document.getElementById('submit-btn').style.display = 'block';
  answers = {}; locked = {};
  const filtered = getFilteredQs();
  renderQuestions(filtered.length ? filtered : QS);
}

function pick(idx, oi) {
  if (locked[idx]) return;
  answers[idx] = oi;
  document.querySelectorAll(`[id^="opt-${idx}-"]`).forEach(b => b.classList.remove('selected'));
  const btn = document.getElementById(`opt-${idx}-${oi}`);
  if (btn) btn.classList.add('selected');
}

function submitAll() {
  let correct = 0, total = 0;
  const wrongNow = [];
  const topicStats = {};

  QS.forEach((q, idx) => {
    const card = document.getElementById('q-' + idx);
    if (!card || card.classList.contains('hidden')) return;
    total++;
    const chosen = answers[idx];
    const isCorrect = chosen === q.answer;
    if (isCorrect) correct++;
    else wrongNow.push(idx);
    locked[idx] = true;

    q.options.forEach((_, oi) => {
      const btn = document.getElementById(`opt-${idx}-${oi}`);
      if (!btn) return;
      btn.classList.add('locked');
      btn.classList.remove('selected');
      if (oi === q.answer) btn.classList.add('correct');
      else if (oi === chosen) btn.classList.add('wrong');
    });
    const exp = document.getElementById('exp-' + idx);
    if (exp) exp.style.display = 'block';

    const t = q.topic || 'General';
    if (!topicStats[t]) topicStats[t] = {correct:0, total:0};
    topicStats[t].total++;
    if (isCorrect) topicStats[t].correct++;
  });

  try { localStorage.setItem('ngmc_wrong_' + SLUG, JSON.stringify(wrongNow)); } catch(e) {}
  try { localStorage.setItem('ngmc_prog_mcq.html', Math.round(correct/Math.max(total,1)*100)); } catch(e) {}

  const pct = total ? Math.round(correct/total*100) : 0;
  const mood = pct >= 80 ? '&#127881;' : pct >= 50 ? '&#128516;' : '&#128517;';

  let topicRows = '';
  Object.entries(topicStats).forEach(([name, st]) => {
    const p = Math.round(st.correct/st.total*100);
    const filled = Math.round(p/20);
    const stars = '&#11088;'.repeat(filled) + '&#9734;'.repeat(5-filled);
    const revise = p < 60 ? `<a class="revise-link" href="notes.html">Revise &rarr;</a>` : '';
    topicRows += `<div class="topic-row"><span class="topic-name">${name}</span><span class="topic-stars">${stars}</span><span class="topic-pct">${p}%</span>${revise}</div>`;
  });

  const wrongBtn = wrongNow.length
    ? `<button class="mode-btn btn-revise" onclick="filterTopic('revision',document.getElementById('btn-revision'))">&#128204; Revise Wrong (${wrongNow.length})</button>` : '';

  const panel = document.getElementById('score-panel');
  panel.innerHTML = `
    <h2>${mood} You scored ${correct} / ${total}</h2>
    <div class="stats-row">
      <div class="stat-box"><div class="num" style="color:#4caf50">${correct}</div><div class="lbl">Correct &#9989;</div></div>
      <div class="stat-box"><div class="num" style="color:#e91e63">${total-correct}</div><div class="lbl">Wrong &#10060;</div></div>
      <div class="stat-box"><div class="num">${pct}%</div><div class="lbl">Score &#128202;</div></div>
    </div>
    <h3 style="margin:.5rem 0;font-family:var(--fh)">&#128218; Topic Analysis</h3>
    ${topicRows}
    <div class="mode-btns">
      <button class="mode-btn btn-retry" onclick="location.reload()">&#128260; Retry All</button>
      ${wrongBtn}
    </div>`;
  panel.style.display = 'block';
  document.getElementById('submit-btn').style.display = 'none';
  panel.scrollIntoView({behavior:'smooth'});
}

if (location.hash === '#revision' && prevWrong.length > 0) {
  filterMode = 'revision';
  document.getElementById('btn-revision').classList.add('active');
  document.querySelector('.topic-btn.active')?.classList.remove('active');
}
renderQuestions(filterMode === 'revision' ? QS.filter((_,i) => prevWrong.includes(i)) : QS);
</script>
</body>
</html>
